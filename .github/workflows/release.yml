name: release

# Push a tag and this publishes the release:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# or, from a phone: Releases → Draft a new release → create the tag there.
#
# The single-file build and the raw dataset are attached, so a reader who
# wants the atlas offline, or the numbers for their own work, does not have
# to clone the repository or know what a build step is.
#
# gh is on the runner already and authenticates with the token GitHub issues
# for this job, so no third-party action and no stored secret is involved.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild from source and check it
        run: |
          python3 scripts/merge_parts.py
          python3 scripts/build_data.py
          python3 scripts/test_build.py
          python3 scripts/build_single.py

      - name: Name the files after the tag
        id: names
        run: |
          v="${GITHUB_REF_NAME}"
          [ -n "$v" ] || v="untagged"
          mkdir -p out
          cp dist/t-air.html      "out/t-air-$v.html"
          cp data/aircraft.json   "out/aircraft-$v.json"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.load(open("data/aircraft.json", encoding="utf-8"))
          print(f"count={d['count']}")
          print(f"checked={d.get('checkedCount', 0)}")
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.names.outputs.version }}
          COUNT: ${{ steps.names.outputs.count }}
          CHECKED: ${{ steps.names.outputs.checked }}
        run: |
          notes=$(cat <<EOF
          **$COUNT هواپیما**، که $CHECKED رکورد آن فیلد به فیلد با منبع مقایسه شده است.

          - \`t-air-$V.html\` — کل اطلس در یک فایل. بازش کنید، بدون اینترنت کار می‌کند.
          - \`aircraft-$V.json\` — خود دیتابیس، برای استفاده در کار خودتان (CC BY-SA 4.0).

          سایت: https://ta100900.github.io/t-air/
          EOF
          )
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" out/* --clobber
          else
            gh release create "$V" out/* --title "T-AIR $V" --notes "$notes"
          fi
