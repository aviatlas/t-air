name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the database and check it
        run: |
          python3 scripts/merge_parts.py
          python3 scripts/build_data.py
          python3 scripts/test_build.py
          python3 scripts/build_single.py

      - name: Fail if the build changed a committed file
        run: |
          git diff --exit-code -- data/aircraft.json dist/ \
            || (echo "::error::data/aircraft.json or dist/ is out of date — run scripts/check.sh and commit the result" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the interface
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/test_ui.js
