<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-AIR</title>
<meta name="description" content="T-AIR — searchable specifications for 656 civil and military aircraft: airliners, propliners, fighters, helicopters and drones. In Persian and English. جست‌وجوی مشخصات فنی هواپیماهای جهان.">
<meta name="theme-color" content="#0b6f80" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080d13" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="T-AIR — World Aircraft Atlas">
<meta property="og:description" content="Searchable specifications for 656 civil and military aircraft, in Persian and English.">
<meta property="og:image" content="assets/social-card.png">
<meta property="og:locale" content="fa_IR">
<meta property="og:locale:alternate" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "Dataset",
 "name": "T-AIR — World Aircraft Atlas",
 "description": "Specifications for 656 civil and military aircraft: type, capacity or crew, speed, range, dimensions, powerplant, armament and production history, in Persian and English.",
 "inLanguage": ["fa", "en"],
 "keywords": ["aircraft", "aviation", "airliner", "fighter", "helicopter", "UAV", "specifications"],
 "creator": {"@type": "Organization", "name": "T-AIR"},
 "distribution": [{"@type": "DataDownload", "encodingFormat": "application/json", "contentUrl": "data/aircraft.json"}]
}
</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<a class="skip" href="#results" data-i18n="skip">پرش به نتایج</a>

<!-- ── top bar ─────────────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="wrap topbar__row">
    <a class="brandchip" href="#top" aria-label="T-AIR">
      <svg class="mark mark--sm" viewBox="0 0 48 48" aria-hidden="true">
        <g fill="currentColor">
          <path d="M19.4 42a1.1 1.1 0 0 1-1.1-1.2l4.9-28.6h7.4v28.7a1.1 1.1 0 0 1-1.1 1.1Z"/>
          <path d="M4.6 7.4h38.8a2.3 2.3 0 0 1 2.2 2.9l-.3 1a1.9 1.9 0 0 1-1.9 1.4H4.6a1.9 1.9 0 0 1-1.9-1.4l-.3-1a2.3 2.3 0 0 1 2.2-2.9Z"/>
        </g>
        <path class="mark__stripe" d="M22.5 25.9h8.2v5h-9.1Z"/>
      </svg>
      <span class="wordmark wordmark--sm">T-AIR</span>
    </a>
    <span class="topbar__tag" data-i18n="tagline">اطلس هواپیماهای جهان</span>
    <span class="topbar__spacer"></span>
    <button class="ghost-btn ghost-btn--lang" id="langBtn" type="button" aria-label="Switch to English">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>
      </svg>
      <span>EN</span>
    </button>
    <button class="ghost-btn" id="themeBtn" type="button" data-i18n-attr="aria-label:themeAria">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
      <span id="themeLabel">تم</span>
    </button>
  </div>
</header>

<!-- ── identity band ───────────────────────────────────────────────────── -->
<section class="hero" id="top">
  <div class="wrap hero__inner">
    <div class="hero__id">
      <div class="lockup">
        <svg class="mark mark--lg" viewBox="0 0 48 48" aria-hidden="true">
          <g fill="currentColor">
            <path class="mark__fin" d="M19.4 42a1.1 1.1 0 0 1-1.1-1.2l4.9-28.6h7.4v28.7a1.1 1.1 0 0 1-1.1 1.1Z"/>
            <path class="mark__plane" d="M4.6 7.4h38.8a2.3 2.3 0 0 1 2.2 2.9l-.3 1a1.9 1.9 0 0 1-1.9 1.4H4.6a1.9 1.9 0 0 1-1.9-1.4l-.3-1a2.3 2.3 0 0 1 2.2-2.9Z"/>
          </g>
          <path class="mark__stripe" d="M22.5 25.9h8.2v5h-9.1Z"/>
        </svg>
        <h1 class="wordmark wordmark--lg">T-AIR</h1>
      </div>
      <p class="hero__fa" data-i18n="heroSub">اطلس هواپیماهای جهان</p>
      <p class="hero__lede" data-i18n="heroLede"></p>
    </div>

    <dl class="stats" id="stats"></dl>
  </div>
  <div class="centerline" aria-hidden="true"></div>
</section>

<!-- ── search dock ─────────────────────────────────────────────────────── -->
<div class="dock-sentinel" id="dockSentinel" aria-hidden="true"></div>
<div class="dock" id="dock">
  <div class="wrap">
    <div class="dock__row">
      <a class="dock__brand" href="#top" aria-label="T-AIR">
        <svg class="mark mark--sm" viewBox="0 0 48 48" aria-hidden="true">
          <g fill="currentColor">
            <path d="M19.4 42a1.1 1.1 0 0 1-1.1-1.2l4.9-28.6h7.4v28.7a1.1 1.1 0 0 1-1.1 1.1Z"/>
            <path d="M4.6 7.4h38.8a2.3 2.3 0 0 1 2.2 2.9l-.3 1a1.9 1.9 0 0 1-1.9 1.4H4.6a1.9 1.9 0 0 1-1.9-1.4l-.3-1a2.3 2.3 0 0 1 2.2-2.9Z"/>
          </g>
          <path class="mark__stripe" d="M22.5 25.9h8.2v5h-9.1Z"/>
        </svg>
      </a>
      <div class="searchfield">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               data-i18n-attr="placeholder:searchPh,aria-label:searchAria">
        <button class="clear-btn" id="clearBtn" type="button" data-i18n-attr="aria-label:clearAria">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <kbd>/</kbd>
      </div>
    </div>
    <div class="filters" id="filters" role="group" aria-label="filters"></div>
    <div class="filters filters--types" id="typeFilters" role="group" aria-label="types"></div>
    <div class="timeline" id="timeline" role="group" aria-label="decades"></div>
  </div>
</div>

<!-- ── results ─────────────────────────────────────────────────────────── -->
<main class="wrap" id="results">
  <div class="resultmeta" aria-live="polite">
    <b id="count">—</b>
    <span data-i18n="resultsLabel">فروند در نتایج</span>
    <div class="resultmeta__tools">
      <button class="minibtn" id="csvBtn" type="button" data-i18n="exportCsv">خروجی CSV</button>
      <button class="minibtn" id="jsonBtn" type="button" data-i18n="exportJson">خروجی JSON</button>
    </div>
  </div>
  <div class="grid" id="grid" role="list"></div>
  <button class="morebtn" id="more" type="button" hidden><span></span></button>
  <div class="empty" id="empty" hidden>
    <svg class="mark mark--md" viewBox="0 0 48 48" aria-hidden="true">
      <g fill="currentColor">
        <path d="M19.4 42a1.1 1.1 0 0 1-1.1-1.2l4.9-28.6h7.4v28.7a1.1 1.1 0 0 1-1.1 1.1Z"/>
        <path d="M4.6 7.4h38.8a2.3 2.3 0 0 1 2.2 2.9l-.3 1a1.9 1.9 0 0 1-1.9 1.4H4.6a1.9 1.9 0 0 1-1.9-1.4l-.3-1a2.3 2.3 0 0 1 2.2-2.9Z"/>
      </g>
    </svg>
    <strong data-i18n="empty1">در T-AIR چیزی پیدا نشد</strong>
    <span data-i18n="empty2">نام مدل را ساده‌تر بنویسید یا فیلترها را بردارید.</span>
  </div>
</main>

<footer>
  <div class="wrap footer__row">
    <div class="footer__brand">
      <svg class="mark mark--sm" viewBox="0 0 48 48" aria-hidden="true">
        <g fill="currentColor">
          <path d="M19.4 42a1.1 1.1 0 0 1-1.1-1.2l4.9-28.6h7.4v28.7a1.1 1.1 0 0 1-1.1 1.1Z"/>
          <path d="M4.6 7.4h38.8a2.3 2.3 0 0 1 2.2 2.9l-.3 1a1.9 1.9 0 0 1-1.9 1.4H4.6a1.9 1.9 0 0 1-1.9-1.4l-.3-1a2.3 2.3 0 0 1 2.2-2.9Z"/>
        </g>
      </svg>
      <span class="wordmark wordmark--sm">T-AIR</span>
    </div>
    <p data-i18n="footer"></p>
    <button class="linkish" id="aboutBtn" type="button" data-i18n="aboutLink">درباره‌ی داده‌ها</button>
  </div>
</footer>

<div class="toast" id="toast" role="status" hidden></div>

<div class="tray" id="tray" hidden></div>

<div class="scrim" id="scrim" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>

<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
